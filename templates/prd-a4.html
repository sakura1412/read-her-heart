<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    @page {
      size: A4;
      margin: 20mm 18mm 19mm;
      @bottom-right {
        content: counter(page);
        color: #000;
        font: 9pt "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      }
    }

    :root { color-scheme: light; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      color: #000;
      background: #fff;
      font: 10.5pt/1.65 "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
      overflow-wrap: anywhere;
    }
    main { max-width: 100%; }
    h1, h2, h3, h4 { line-height: 1.35; break-after: avoid-page; }
    h1 { font-size: 20pt; margin: 0 0 7mm; padding-bottom: 3mm; border-bottom: 1.5pt solid #2463a5; }
    h2 { font-size: 14pt; margin: 8mm 0 3mm; padding-bottom: 1.5mm; border-bottom: 0.5pt solid #cbd5e1; }
    h3 { font-size: 11.5pt; margin: 5mm 0 2mm; }
    h4 { font-size: 10.5pt; margin: 4mm 0 1.5mm; }
    p, ul, ol, blockquote, pre, table { margin: 0 0 3.5mm; }
    ul, ol { padding-left: 1.5em; }
    li { margin: 1mm 0; }
    li > p { margin-bottom: 1mm; }
    blockquote { padding: 1mm 0 1mm 4mm; border-left: 2pt solid #94a3b8; }
    a { text-decoration: underline; }
    code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9pt; }
    code { background: #f1f5f9; padding: 0 1mm; }
    pre { padding: 3mm; background: #f8fafc; white-space: pre-wrap; overflow-wrap: anywhere; }
    pre code { background: transparent; padding: 0; }
    table { width: 100%; border-collapse: collapse; font-size: 9pt; line-height: 1.5; }
    thead { display: table-header-group; }
    tr { break-inside: avoid-page; }
    th, td { border: 0.5pt solid #cbd5e1; padding: 2mm 2.5mm; vertical-align: top; }
    th { background: #eaf1f8; font-weight: 600; text-align: left; }
    hr { border: 0; border-top: 0.5pt solid #cbd5e1; margin: 5mm 0; }
    img { max-width: 100%; height: auto; }

    /* 所有 PRD 文字使用纯黑；覆盖渲染器的灰色注释、元信息和代码高亮。 */
    body, body *, body::before, body::after, body *::before, body *::after {
      color: #000 !important;
    }
    svg text, svg tspan, svg textPath { fill: #000 !important; }
    /* 重点默认用 strong 加粗；需要红字时显式使用 prd-emphasis，不自动给整段着色。 */
    body .prd-emphasis, body .prd-emphasis *,
    body .prd-emphasis::before, body .prd-emphasis::after,
    body .prd-emphasis *::before, body .prd-emphasis *::after {
      color: #c00000 !important;
    }
    svg text.prd-emphasis, svg text.prd-emphasis tspan { fill: #c00000 !important; }

    @media screen {
      body { max-width: 210mm; margin: 0 auto; padding: 20mm 18mm; box-shadow: 0 0 12px #d4dbe4; }
    }
    @media print {
      body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <!-- 把对应 PRD Markdown 模板渲染为 HTML 后替换 CONTENT_HTML；标题、版本、日期、状态及修订版的相对上版变更摘要由同一源稿提供。 -->
  <main>{{CONTENT_HTML}}</main>
</body>
</html>
